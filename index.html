<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f9d76">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="羽毛球抽签">
<meta name="description" content="羽毛球电子抽签：录入名单，一键随机分组（单打 / 双打 / 混双），生成二维码和分组海报分享给球友。手机端适配。">
<title>羽毛球抽签 · 电子分组</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f9d76'/%3E%3Cg fill='%23ffffff'%3E%3Cpath d='M32 14c6 0 10 5 10 11 0 3-1 5-3 7l-1 1H26l-1-1c-2-2-3-4-3-7 0-6 4-11 10-11z' opacity='.95'/%3E%3Cpath d='M30 36h4l-1 12-1 4-1-4z' opacity='.8'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg-glow" aria-hidden="true"></div>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">🏸</div>
      <div class="brand-txt">
        <h1>羽毛球抽签</h1>
        <p>电子分组 · 单打 / 双打</p>
      </div>
    </div>
    <button class="icon-btn" id="btnReset" type="button" aria-label="重置">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>
  </header>

  <nav class="steps" id="steps" aria-label="步骤">
    <button class="step is-active" data-step="1" type="button"><i>1</i><span>名单</span></button>
    <span class="step-line"></span>
    <button class="step" data-step="2" type="button"><i>2</i><span>分组</span></button>
    <span class="step-line"></span>
    <button class="step" data-step="3" type="button"><i>3</i><span>分享</span></button>
  </nav>

  <main class="main">
    <!-- ===================== 第一步：名单 ===================== -->
    <section class="view" id="viewSetup">
      <div class="card">
        <div class="card-head">
          <h2>比赛信息</h2>
        </div>
        <label class="field">
          <span class="label">比赛名称 <em>选填</em></span>
          <input id="titleInput" type="text" maxlength="24" placeholder="例如：2026 春季羽毛球友谊赛" autocomplete="off">
        </label>
        <div class="field">
          <span class="label">项目类型</span>
          <div class="chips" id="eventChips"></div>
          <p class="hint" id="eventHint"></p>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>参赛名单</h2>
          <span class="counter" id="playerCounter">0 人</span>
        </div>
        <div class="input-row">
          <input id="playerInput" type="text" placeholder="输入姓名后回车，可一次粘贴多个" autocomplete="off" enterkeyhint="done">
          <button class="btn btn-soft btn-add" id="btnAdd" type="button">添加</button>
        </div>
        <div class="roster" id="roster"></div>
        <p class="empty" id="rosterEmpty">还没有选手，先添加姓名或导入名单 👇</p>
        <div class="row-actions">
          <button class="btn btn-ghost" id="btnBulk" type="button">批量粘贴</button>
          <button class="btn btn-ghost" id="btnSample" type="button">示例名单</button>
          <button class="btn btn-ghost is-danger" id="btnClear" type="button">清空</button>
        </div>
        <p class="hint">点击姓名可标记 <b class="star">★ 种子</b>，种子会优先分散到不同小组。</p>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>分组设置</h2>
        </div>
        <div class="setting-row">
          <div class="setting-txt">
            <b>分成几个小组</b>
            <span id="groupHint">每组约 4 人</span>
          </div>
          <div class="stepper">
            <button class="step-btn" id="gMinus" type="button" aria-label="减少组数">−</button>
            <b id="groupCount">4</b>
            <button class="step-btn" id="gPlus" type="button" aria-label="增加组数">+</button>
          </div>
        </div>
        <div class="setting-row">
          <div class="setting-txt">
            <b>种子分散</b>
            <span>让种子分别落在不同小组</span>
          </div>
          <button class="switch is-on" id="swSeed" type="button" role="switch" aria-checked="true"><i></i></button>
        </div>
      </div>

      <p class="foot-note">分组结果只保存在本机浏览器，也可以生成二维码分享给球友。</p>
    </section>

    <!-- ===================== 第二步：分组结果 ===================== -->
    <section class="view hidden" id="viewResult">
      <div class="card result-head">
        <div class="rh-top">
          <div class="rh-title">
            <h2 id="resTitle">分组结果</h2>
            <p class="sub" id="resMeta"></p>
          </div>
          <span class="pill" id="resEvent">男单</span>
        </div>
        <div class="stat-row" id="resStats"></div>
      </div>

      <div class="groups" id="groups"></div>

      <div class="result-tips">
        <p><b>小提示</b>：依次点选两名选手即可交换位置；点「重新抽签」可再摇一次。</p>
        <p id="seedLegend" class="legend-line"><span class="star">★</span> 为种子选手</p>
      </div>
    </section>
  </main>
</div>

<!-- ===================== 底部操作栏 ===================== -->
<div class="actionbar" id="actionbar">
  <div class="actionbar-inner" id="abSetup">
    <button class="btn btn-primary btn-block" id="btnDraw" type="button" disabled>开始抽签分组</button>
  </div>
  <div class="actionbar-inner hidden" id="abResult">
    <button class="btn btn-ghost btn-back" id="btnBack" type="button">修改</button>
    <button class="btn btn-soft" id="btnRedraw" type="button">重新抽签</button>
    <button class="btn btn-primary" id="btnShare" type="button">生成二维码</button>
  </div>
</div>

<!-- ===================== 二维码 / 分享面板 ===================== -->
<div class="sheet-wrap" id="shareWrap" hidden>
  <div class="sheet-backdrop" data-close="share"></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
    <div class="sheet-grab" aria-hidden="true"></div>
    <header class="sheet-head">
      <h3 id="shareTitle">保存 / 分享分组</h3>
      <button class="icon-btn" type="button" data-close="share" aria-label="关闭">✕</button>
    </header>
    <div class="sheet-body">
      <div class="qr-box">
        <div class="qr-frame">
          <canvas id="qrCanvas" width="512" height="512"></canvas>
        </div>
        <p class="qr-tip" id="qrTip">扫码即可打开并还原本次分组</p>
        <p class="qr-info" id="qrInfo"></p>
      </div>

      <div class="code-row">
        <input id="codeText" readonly>
        <button class="btn btn-soft" id="btnCopyCode" type="button">复制</button>
      </div>

      <div class="grid2">
        <button class="btn btn-soft" id="btnSaveQr" type="button">保存二维码</button>
        <button class="btn btn-soft" id="btnSavePoster" type="button">保存分组海报</button>
        <button class="btn btn-soft" id="btnCopyText" type="button">复制文字结果</button>
        <button class="btn btn-soft" id="btnImport" type="button">导入二维码内容</button>
      </div>

      <p class="hint" id="qrWarn"></p>
    </div>
  </section>
</div>

<!-- ===================== 批量粘贴面板 ===================== -->
<div class="sheet-wrap" id="bulkWrap" hidden>
  <div class="sheet-backdrop" data-close="bulk"></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="bulkTitle">
    <div class="sheet-grab" aria-hidden="true"></div>
    <header class="sheet-head">
      <h3 id="bulkTitle">批量导入名单</h3>
      <button class="icon-btn" type="button" data-close="bulk" aria-label="关闭">✕</button>
    </header>
    <div class="sheet-body">
      <textarea id="bulkText" rows="8" placeholder="每行一个姓名或一组搭档&#10;支持从 Excel 直接粘贴&#10;&#10;张三&#10;李四&#10;王五/赵六"></textarea>
      <p class="hint">自动忽略行号、序号和空行，重复姓名会被跳过。</p>
      <div class="row-actions">
        <button class="btn btn-primary btn-block" id="btnBulkImport" type="button">导入名单</button>
      </div>
    </div>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="vendor/qrcode.js"></script>
<script src="app.js"></script>
</body>
</html>
